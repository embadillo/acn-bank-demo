<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACN Bank - Virtual Assistant</title>

    <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">

    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .loading-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; color: #333;
            z-index: 10; background-color: #f4f6f9;
            transition: opacity 0.4s ease;
        }
        chat-messenger {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100vh !important;
            max-height: 100vh !important;
            margin: 0 !important; padding: 0 !important;
            z-index: 5;
            display: none;
        }
        chat-messenger-container {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-container">
        <h2>Connecting to ACN Bank secure channel...</h2>
        <p>Please wait while we transfer your verification session.</p>
    </div>

    <chat-messenger url-allowlist="*">
        <chat-messenger-container
            chat-title="ACN Bank Demo"
            chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
            enable-file-upload
            enable-audio-input>
            <chat-reset-session-button slot="titlebar-actions" title-text="Start new chat"></chat-reset-session-button>
            <chat-toggle-dialog-button slot="titlebar-actions" title-text-expanded="Collapse" title-text-collapsed="Expand"></chat-toggle-dialog-button>
            <chat-messenger-close-button slot="titlebar-actions" title-text="Close"></chat-messenger-close-button>
        </chat-messenger-container>
    </chat-messenger>

    <script>
        /* ════════════════════════════════════════════════════════════════
           SECCIÓN 1 — PARÁMETROS DE URL (KYC voice handoff)
        ════════════════════════════════════════════════════════════════ */
        const urlParams = new URLSearchParams(window.location.search);

        const kycRequestId =
        urlParams.get('r') || urlParams.get('kyc_request_id');

        const customerDocId =
        urlParams.get('c') || urlParams.get('customer_doc_id');

        console.log("=== KYC Parameters Detected ===");
        console.log("KYC Request ID:", kycRequestId);
        console.log("Customer Doc ID:", customerDocId);

        /* ════════════════════════════════════════════════════════════════
           SECCIÓN 2 — LOGOS
        ════════════════════════════════════════════════════════════════ */
        const BASE = "https://raw.githubusercontent.com/embadillo/acn-bank-assets/refs/heads/main/";
        const PAYEE_LOGOS = {
            "hydro one":             BASE + "Hydro-Logo-from-web-558.jpeg",
            "rogers communications": BASE + "rogerssocial-1.jpg",
            "enbridge gas":          BASE + "enbridge.png",
            "bell canada":           BASE + "aHR0cHM6Ly9pbWFnZXMuY29udGVudHN0YWNrLmlvL3YzL2Fzc2V0cy9ibHRmYTgyMjcxYzllZDAxMDBiL2JsdDQzMTQyZjFjODQ0NjQ5MjUvNjllNjk0NDcwODEyMGIwZTUyMTRkZmE2L0JlbGxHUENhbmFkYV9WZXJfUkdCLmpwZw%3D%3D.jpg",
            "toronto property tax":  BASE + "Captura%20de%20pantalla%202026-06-07%20141855.png",
        };

        function getPayeeLogo(payeeName) {
            const key = (payeeName || "").toLowerCase().trim();
            for (const [name, url] of Object.entries(PAYEE_LOGOS)) {
                if (key.includes(name)) return url;
            }
            return null;
        }

        function getPayeeEmoji(payeeName) {
            const p = (payeeName || "").toLowerCase();
            if (p.includes("hydro") || p.includes("electric") || p.includes("power")) return "⚡";
            if (p.includes("rogers") || p.includes("bell") || p.includes("telus"))     return "📱";
            if (p.includes("gas") || p.includes("enbridge"))                           return "🔥";
            if (p.includes("tax") || p.includes("government") || p.includes("city"))   return "🏛️";
            if (p.includes("water"))                                                    return "💧";
            if (p.includes("insurance"))                                                return "🛡️";
            return "🏦";
        }

        /* ════════════════════════════════════════════════════════════════
           SECCIÓN 3 — BUILDER: buildPaymentCarousel (UI Premium)
        ════════════════════════════════════════════════════════════════ */
        function buildPaymentCarousel(payload) {
            const payments = payload.payments || [];
            const id = "carousel_" + Date.now();
            
            const cards = payments.map((p, index) => {
                const status     = (p.status || "").toLowerCase();
                const badgeClass = status === "processing" ? "acn-badge-processing"
                                 : status === "cancelled"  ? "acn-badge-cancelled"
                                 : "acn-badge-scheduled";
                const badgeLabel = p.status ? p.status.charAt(0).toUpperCase() + p.status.slice(1) : "Scheduled";

                const logoUrl  = getPayeeLogo(p.payee_name);
                
                // Icono más grande (44px)
                const iconHtml = logoUrl
                    ? `<img src="${logoUrl}" alt="${p.payee_name}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">`
                    : `<span style="font-size:20px">${getPayeeEmoji(p.payee_name)}</span>`;

                const badgeColors = {
                    "acn-badge-scheduled":  "background:#e7f3e8;color:#2d6a2f;",
                    "acn-badge-processing": "background:#fef3cd;color:#8a5a00;",
                    "acn-badge-cancelled":  "background:#fde8e8;color:#9b1c1c;",
                };

                // Añadimos data-action="cancel" para blindar la detección del clic
                const btnHtml = p.cancellable
                    ? `<button data-action="cancel"
                               data-payee="${escapeAttr(p.payee_name)}"
                               data-cta="${escapeAttr(p.cta_value)}"
                               style="width:100%;padding:9px 0;border:1px solid #d1d5db;border-radius:8px;
                                      background:transparent;font-size:13px;font-weight:500;color:#1a1a2e;
                                      cursor:pointer;margin-top:auto;text-align:center;display:flex;justify-content:center;
                                      transition: background 0.15s, border-color 0.15s;">
                           ${p.cta_label || "Cancel payment"}
                       </button>`
                    : `<button data-action="cancel" data-disabled="true"
                               style="width:100%;padding:9px 0;border:1px solid #e5e7eb;border-radius:8px;
                                      background:transparent;font-size:13px;color:#9ca3af;cursor:default;pointer-events:none;
                                      text-align:center;display:flex;justify-content:center;margin-top:auto;">
                           ${p.cta_label || badgeLabel}
                       </button>`;

                // Tarjetas con ancho 220px
                return `
                    <div style="background:#fff;border:1px solid #e0e4ea;border-radius:16px;padding:16px;
                                width:220px;flex: 0 0 auto;scroll-snap-align:start;
                                display:flex;flex-direction:column;gap:10px;box-sizing:border-box;">
                        
                        <div style="display:flex;align-items:center;gap:10px;min-height:48px;">
                            <div style="width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #e5e7eb;
                                        display:flex;align-items:center;justify-content:center;
                                        flex-shrink:0;overflow:hidden;box-sizing:border-box;padding:3px;">
                                ${iconHtml}
                            </div>
                            <div style="font-size:14px;font-weight:600;color:#1a1a2e;line-height:1.2;white-space:normal;word-break:break-word;">
                                ${p.payee_name || ""}
                            </div>
                        </div>

                        <span style="display:inline-block;padding:3px 10px;border-radius:20px;
                                     font-size:12px;font-weight:500;width:fit-content;
                                     ${badgeColors[badgeClass] || badgeColors['acn-badge-scheduled']}">
                            ${badgeLabel}
                        </span>

                        <div style="font-size:13px;color:#374151;display:flex;align-items:center;gap:5px;margin-top:2px;">
                            📅 ${p.display_date || ""}
                        </div>
                        <div style="font-size:13px;font-weight:600;color:#374151;display:flex;align-items:center;gap:5px;">
                            💲 ${p.currency || "CAD"} ${p.amount || ""}
                        </div>
                        
                        ${btnHtml}
                    </div>
                `;
            }).join("");

            // Flecha posicionada correctamente para que no solape
            const rightArrow = payments.length > 2 ? `
                <button data-action="next" data-track-id="${id}"
                        style="position:absolute;right:0px;top:50%;transform:translateY(-50%);z-index:10;
                               width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #d1d5db;
                               box-shadow:-2px 0 8px rgba(0,0,0,0.1);cursor:pointer;display:flex;align-items:center;
                               justify-content:center;color:#1a56db;font-weight:bold;font-size:16px;padding-left:3px;">
                    ❯
                </button>
            ` : "";

            return `
                <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
                            width:100%;box-sizing:border-box;overflow:hidden;padding: 5px 0;">
                    
                    <div style="font-size:15px;font-weight:600;color:#1a1a2e;margin-bottom:4px;">
                        📅 ${payload.title || "Upcoming scheduled payments"}
                    </div>
                    <div style="font-size:13px;color:#6b7280;margin-bottom:12px;">
                        ${payload.subtitle || ""}
                    </div>
                    
                    <div style="position:relative;width:100%;">
                        <!-- Track con padding-right de 45px para dar espacio a la flecha -->
                        <div id="${id}"
                             style="display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
                                    scrollbar-width:none;padding-bottom:10px;padding-right:45px;">
                            ${cards}
                        </div>
                        ${rightArrow}
                    </div>
                </div>
            `;
        }

        /* ════════════════════════════════════════════════════════════════
           SECCIÓN 4 — HELPERS Y DELEGACIÓN DE EVENTOS (SHADOW DOM FIX)
        ════════════════════════════════════════════════════════════════ */
        function acnSendMessage(text) {
            const chatEl = document.querySelector("chat-messenger");
            if (chatEl && typeof chatEl.sendMessage === "function") {
                chatEl.sendMessage({ text });
            }
        }

        function acnCancelPayment(btn, payeeName, ctaValue) {
            btn.textContent = "Cancelled";
            btn.setAttribute("data-disabled", "true");
            btn.style.color = "#9b1c1c";
            btn.style.borderColor = "#fca5a5";
            btn.style.pointerEvents = "none";
            btn.style.cursor = "default";
            acnSendMessage(ctaValue || "cancel_payment:" + payeeName);
        }

        function escapeAttr(str) {
            return (str || "").replace(/'/g, "\\\\'").replace(/"/g, "&quot;");
        }

        /* ── INTERCEPTOR DE CLICS (Inmune a Shadow DOM y DOMPurify) ── */
        document.addEventListener("click", (e) => {
            // e.composedPath() nos permite penetrar el Shadow DOM y ver el botón real clickeado
            const path = e.composedPath();

            // 1. Clic en botón "Cancel Payment"
            const cancelBtn = path.find(el => el.getAttribute && el.getAttribute("data-action") === "cancel");
            if (cancelBtn && cancelBtn.getAttribute("data-disabled") !== "true") {
                const payee = cancelBtn.getAttribute("data-payee");
                const cta = cancelBtn.getAttribute("data-cta");
                acnCancelPayment(cancelBtn, payee, cta);
            }

            // 2. Clic en Flecha Siguiente del Carrusel
            const nextBtn = path.find(el => el.getAttribute && el.getAttribute("data-action") === "next");
            if (nextBtn) {
                const trackId = nextBtn.getAttribute("data-track-id");
                
                // Navegamos al Shadow DOM para encontrar la lista
                const chatMessenger = document.querySelector("chat-messenger");
                const chatContainer = chatMessenger?.shadowRoot?.querySelector("df-messenger-chat") 
                                   || chatMessenger?.shadowRoot?.querySelector("chat-messenger-chat");
                
                if (chatContainer) {
                    const track = chatContainer.shadowRoot?.getElementById(trackId);
                    if (track) {
                        const card = track.firstElementChild;
                        // Ancho de la tarjeta (220) + Gap (12) = 232px de desplazamiento
                        const scrollAmount = card ? card.offsetWidth + 12 : 232; 
                        track.scrollBy({ left: scrollAmount, behavior: "smooth" });
                    }
                }
            }
        });

        /* ════════════════════════════════════════════════════════════════
           SECCIÓN 5 — INICIALIZACIÓN PRINCIPAL
        ════════════════════════════════════════════════════════════════ */
        window.addEventListener("chat-messenger-loaded", () => {
            console.log("Widget loaded. Checking handoff context...");
            const isVoiceHandoff = !!(kycRequestId && customerDocId);
            
            chatSdk.registerContext(
                chatSdk.prebuilts.ces.createContext({
                    deploymentName: "projects/483471568825/locations/us/apps/27be6c70-74dc-4e50-a3e8-25b032e7c965/deployments/7cbb68f9-147f-4698-be02-e7ea5fa5d1a3",
                    tokenBroker: { enableTokenBroker: true, enableRecaptcha: false },
                    sessionParameters: { "is_voice_handoff": isVoiceHandoff }
                }),
            );

            const chatEl        = document.querySelector("chat-messenger");
            const loadingScreen = document.getElementById("loadingScreen");

            /* ── INTERCEPTOR QUIRÚRGICO DE CES ────────── */
            chatEl.addEventListener("chat-messenger-response-received", (event) => {
                const outputs = event.detail?.raw?.outputs || [];
                
                outputs.forEach(output => {
                    const messages = output?.diagnosticInfo?.messages || [];
                    messages.forEach(message => {
                        const chunks = message.chunks || [];
                        chunks.forEach(chunk => {
                            const toolCall = chunk.toolCall;
                            if (!toolCall) return;

                            const toolName = toolCall.displayName || toolCall.name || "";
                            const payload  = toolCall.args?.payload;

                            if (!payload) return;

                            const isPaymentCarousel =
                                toolName === "acn-payment-carousel" ||
                                payload.name === "acn-payment-carousel" ||
                                Array.isArray(payload.payments);

                            if (isPaymentCarousel) {
                                chatEl.renderCustomCard([{
                                    type: "html",
                                    html: buildPaymentCarousel(payload)
                                }]);
                            }
                        });
                    });
                });
            });

            /* ── MOSTRAR CHAT Y FLUJO KYC ───────────────────────── */
            const showChatUI = () => {
                if (chatEl) {
                    chatEl.style.display = "block";
                    if (typeof chatEl.openChat === "function") chatEl.openChat();
                    else if (typeof chatEl.expandChatWindow === "function") chatEl.expandChatWindow();
                    else chatEl.setAttribute("open", "true");
                }
                if (loadingScreen) loadingScreen.style.display = "none";
            };

            if (isVoiceHandoff) {
                setTimeout(() => {
                    const kycPayload = `continue_kyc_upload:${kycRequestId}:${customerDocId}`;
                    showChatUI();
                    if (chatEl && typeof chatEl.sendQuery === "function") {
                        chatEl.sendQuery(kycPayload);
                    } else if (chatEl && typeof chatEl.sendMessage === "function") {
                        chatEl.sendMessage({ text: kycPayload });
                    }
                }, 1500);
            } else {
                showChatUI();
            }
        });
    </script>
</body>
</html>
